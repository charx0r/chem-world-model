[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chemworldmodel"
version = "0.1.0"
description = "An open knowledge graph for chemistry built on PostgreSQL"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0.48",
    "psycopg[binary]>=3.2.13",
    "psycopg2-binary>=2.9.11",
    "alembic>=1.16.5",
    "pgvector>=0.4.2",
    "fastapi>=0.128.8",
    "uvicorn[standard]>=0.39.0",
    "click>=8.3.1",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "structlog>=24.1.0",
    "rdkit>=2025.9.6",
    "ord-schema>=0.3.99",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
    "mypy>=1.10",
]

[project.scripts]
chemworldmodel = "chemworldmodel.cli.main:cli"

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["chemworldmodel"]
